name: Deploy Docs

on:
  push:
    branches: [master]
    paths: ['docs-site/**', '.github/workflows/deploy-docs.yml']
  pull_request:
    paths: ['docs-site/**', '.github/workflows/deploy-docs.yml']
  workflow_dispatch:

permissions:
  contents: read

# One run per ref at a time, so an older build can never finish last and
# become the live site. PR builds cancel superseded runs; master deploys queue.
concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Starlight's lastUpdated reads per-file dates from git history.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
        working-directory: docs-site
      - name: Build
        run: bun run build
        working-directory: docs-site
      - uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: docs-site/dist

  deploy:
    # Swappable hosting step: replace this job to change where docs are served.
    # Only master publishes to production; a manual dispatch from any other
    # ref just runs the build job.
    name: Deploy to Cloudflare Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-dist
          path: dist
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=gitpm-docs --branch=master
