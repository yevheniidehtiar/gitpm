name: Release

on:
  push:
    tags:
      - 'v*'
      - '*-v*'

permissions:
  contents: write

jobs:
  # Publishing needs an NPM_TOKEN secret in the "npm" GitHub environment.
  # Create it on npmjs.com as a granular access token with read and write
  # (publish) rights on the @gitpm scope. Without it every publish step fails.
  #
  # Each publish step first checks whether that exact version is already on
  # npm and skips if so, so re-running a tag is safe. Packages are published
  # with `bun publish`, which rewrites `workspace:*` dependencies to the real
  # versions. Plain `npm publish` does not and produces uninstallable packages.
  release:
    name: Build, Test & Publish
    runs-on: ubuntu-latest
    environment: npm
    env:
      NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Test
        run: npx vitest run

      - name: Publish @gitpm/core
        working-directory: packages/core
        run: |
          spec="$(node -p "require('./package.json').name + '@' + require('./package.json').version")"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "$spec is already on npm, skipping"
          else
            bun publish --access public
          fi

      - name: Publish @gitpm/sync-github
        working-directory: packages/sync-github
        run: |
          spec="$(node -p "require('./package.json').name + '@' + require('./package.json').version")"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "$spec is already on npm, skipping"
          else
            bun publish --access public
          fi

      - name: Publish @gitpm/sync-gitlab
        working-directory: packages/sync-gitlab
        run: |
          spec="$(node -p "require('./package.json').name + '@' + require('./package.json').version")"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "$spec is already on npm, skipping"
          else
            bun publish --access public
          fi

      - name: Publish @gitpm/sync-jira
        working-directory: packages/sync-jira
        run: |
          spec="$(node -p "require('./package.json').name + '@' + require('./package.json').version")"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "$spec is already on npm, skipping"
          else
            bun publish --access public
          fi

      - name: Publish @gitpm/sync-linear
        working-directory: packages/sync-linear
        run: |
          spec="$(node -p "require('./package.json').name + '@' + require('./package.json').version")"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "$spec is already on npm, skipping"
          else
            bun publish --access public
          fi

      - name: Publish @gitpm/sync-bitbucket
        working-directory: packages/sync-bitbucket
        run: |
          spec="$(node -p "require('./package.json').name + '@' + require('./package.json').version")"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "$spec is already on npm, skipping"
          else
            bun publish --access public
          fi

      - name: Publish @gitpm/cli
        working-directory: packages/cli
        run: |
          spec="$(node -p "require('./package.json').name + '@' + require('./package.json').version")"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "$spec is already on npm, skipping"
          else
            bun publish --access public
          fi

      - name: Publish @gitpm/ui
        working-directory: packages/ui
        run: |
          spec="$(node -p "require('./package.json').name + '@' + require('./package.json').version")"
          if npm view "$spec" version >/dev/null 2>&1; then
