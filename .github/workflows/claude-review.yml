name: Claude Code Review

# Runs the official `/code-review` skill (code-review plugin) and posts
# findings as inline PR comments. Advisory only: the check never fails on
# findings. Authenticates Claude with the CLAUDE_CODE_OAUTH_TOKEN secret
# (`claude setup-token`). See docs/ci-claude-review.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]
    # Nothing to review on docs/.meta/license-only PRs. If "Claude Review"
    # ever becomes a required check, replace this with a per-job paths
    # filter — required checks that never run block merge.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'zensical.toml'
      - '.meta/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: Claude Review
    # Skip forks (no secrets), drafts, and bot PRs or pushes: Dependabot
    # gets no secrets, release-please PRs are only version bumps, and
    # claude-code-action refuses non-human actors anyway.
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot' &&
      !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Post as github-actions[bot]; no Claude GitHub App install needed.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: code-review@claude-code-plugins
          prompt: /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          # The action only starts the inline-comment MCP server when this
          # tool is named in --allowedTools.
          claude_args: --allowedTools "mcp__github_inline_comment__create_inline_comment"
