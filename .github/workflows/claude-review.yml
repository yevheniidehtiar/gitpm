name: Claude Code Review

# Two jobs:
#   review       — runs the official `/code-review` skill (code-review plugin)
#                  and posts findings as inline PR comments. Advisory only:
#                  the check never fails on findings.
#   autofix-loop — waits for the other CI checks on HEAD, asks Claude to fix
#                  failures (and, once per human push, the review comments),
#                  and pushes the fix back to the PR branch.
# Both authenticate Claude with the CLAUDE_CODE_OAUTH_TOKEN secret
# (`claude setup-token`). See docs/ci-claude-review.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]
    # Nothing to review or fix on docs/.meta/license-only PRs. If "Claude
    # Review" ever becomes a required check, replace this with a per-job
    # paths filter — required checks that never run block merge.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'docs-site/**'
      - '.meta/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: Claude Review
    # Secrets are withheld from fork PRs, and drafts aren't ready for review.
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Don't re-review our own autofix commits: it duplicates comments and
      # would feed the autofix loop its own output.
      - name: Skip autofix pushes
        id: author
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EMAIL=$(gh api "repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha }}" --jq '.commit.author.email')
          echo "autofix=$([ "$EMAIL" = claude-autofix@users.noreply.github.com ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.author.outputs.autofix != 'true'
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        if: steps.author.outputs.autofix != 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Post as github-actions[bot]; no Claude GitHub App install needed.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: code-review@claude-code-plugins
          prompt: /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          # The action only starts the inline-comment MCP server when this
          # tool is named in --allowedTools.
          claude_args: --allowedTools "mcp__github_inline_comment__create_inline_comment"

  autofix-loop:
    name: Claude Autofix Loop
    needs: review
    # Run even if review errored; never on forks (can't push there).
    if: |
      always() &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: read
      checks: read
      actions: read
    env:
      MAX_ITERATIONS: 5
      SLEEP_SEC: 45
      SELF_JOBS: '["Claude Autofix Loop"]'
      AUTOFIX_EMAIL: claude-autofix@users.noreply.github.com
    steps:
      # Decide up front whether there is anything to do, before paying for
      # the App token, checkout, and bun install:
      #   - failing/pending checks → fix CI
      #   - Claude left review comments on HEAD, and HEAD is a human push
      #     (not one of our own autofix commits) → one pass on the comments
      - name: Pre-check
        id: precheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          RUNS=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs" --paginate --jq '.check_runs[]' \
            | jq -s --argjson self "$SELF_JOBS" '[.[] | select(.name as $n | $self | index($n) | not)]')
          PENDING=$(echo "$RUNS" | jq '[.[] | select(.status != "completed")] | length')
          FAILING=$(echo "$RUNS" | jq '[.[] | select(.conclusion == "failure" or .conclusion == "timed_out")] | length')

          AUTHOR=$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq '.commit.author.email')
          COMMENTS=0
          if [ "$AUTHOR" != "$AUTOFIX_EMAIL" ]; then
            COMMENTS=$(gh api "repos/$REPO/pulls/$PR_NUMBER/comments" --paginate \
              --jq "[.[] | select(.user.login == \"github-actions[bot]\" and .commit_id == \"$HEAD_SHA\")] | length" \
              | jq -s 'add // 0')
          fi
          # Each autofix push starts a new run (and cancels this one), so the
          # in-job iteration cap alone can't bound the loop. Count the
          # trailing autofix commits on the PR and stop at the cap.
          STREAK=$(gh api "repos/$REPO/pulls/$PR_NUMBER/commits" --paginate --jq '.[].commit.author.email' \
            | jq -Rs --arg bot "$AUTOFIX_EMAIL" 'split("\n") | map(select(length > 0)) | reverse
                | (map(. == $bot) | index(false)) // length')
          echo "pending=$PENDING failing=$FAILING review_comments=$COMMENTS head_author=$AUTHOR autofix_streak=$STREAK"

          if [ "$STREAK" -ge "$MAX_ITERATIONS" ]; then
            echo "::warning::$STREAK consecutive autofix commits — stopping. Manual intervention required."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$PENDING" -eq 0 ] && [ "$FAILING" -eq 0 ] && [ "$COMMENTS" -eq 0 ]; then
            echo "Nothing to fix — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "review_comments=$COMMENTS" >> "$GITHUB_OUTPUT"

      # App token, not GITHUB_TOKEN: pushes made with GITHUB_TOKEN don't
      # trigger new workflow runs, so the loop would never see fresh checks.
      - name: Generate GitHub App token
        if: steps.precheck.outputs.skip != 'true'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        if: steps.precheck.outputs.skip != 'true'
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app-token.outputs.token }}

      - uses: oven-sh/setup-bun@v2
        if: steps.precheck.outputs.skip != 'true'
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        if: steps.precheck.outputs.skip != 'true'
        with:
          node-version: '22'

      - name: Cache bun install
        if: steps.precheck.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies and Claude Code
        if: steps.precheck.outputs.skip != 'true'
        run: |
          bun install
          npm install -g @anthropic-ai/claude-code
          git config user.name "claude-autofix[bot]"
          git config user.email "$AUTOFIX_EMAIL"

      - name: Wait-and-fix loop
        if: steps.precheck.outputs.skip != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_COMMENTS: ${{ steps.precheck.outputs.review_comments }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/autofix
          summary() { printf '## Claude Autofix Loop\n\n%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"; }

          # Review comments are addressed at most once, on the first pass.
          FIX_REVIEW=$([ "${REVIEW_COMMENTS:-0}" -gt 0 ] && echo true || echo false)

          for i in $(seq 1 "$MAX_ITERATIONS"); do
            echo "::group::Iteration $i — poll"
            HEAD_SHA=$(git rev-parse HEAD)
            RUNS=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs" --paginate --jq '.check_runs[]' \
              | jq -s --argjson self "$SELF_JOBS" '[.[] | select(.name as $n | $self | index($n) | not)]')
            TOTAL=$(echo "$RUNS" | jq 'length')
            PENDING=$(echo "$RUNS" | jq '[.[] | select(.status != "completed")] | length')
            FAILING=$(echo "$RUNS" | jq '[.[] | select(.conclusion == "failure" or .conclusion == "timed_out")]')
            FAIL_COUNT=$(echo "$FAILING" | jq 'length')
            echo "HEAD=$HEAD_SHA checks=$TOTAL pending=$PENDING failing=$FAIL_COUNT fix_review=$FIX_REVIEW"

            if [ "$FIX_REVIEW" != true ] && { [ "$TOTAL" -eq 0 ] || [ "$PENDING" -gt 0 ]; }; then
              echo "::endgroup::"; sleep "$SLEEP_SEC"; continue
            fi
            if [ "$FIX_REVIEW" != true ] && [ "$FAIL_COUNT" -eq 0 ]; then
              summary "All checks green after $((i - 1)) fix iteration(s)."
              echo "::endgroup::"; exit 0
            fi

            echo "$FAILING" | jq '[.[] | {name, conclusion, url: .html_url, title: .output.title, summary: .output.summary}]' \
              > /tmp/autofix/failing-checks.json
            rm -f /tmp/autofix/review-comments.json
            if [ "$FIX_REVIEW" = true ]; then
              gh api "repos/$REPO/pulls/$PR_NUMBER/comments" --paginate \
                --jq "[.[] | select(.user.login == \"github-actions[bot]\" and .commit_id == \"$HEAD_SHA\") | {path, line, body}]" \
                | jq -s 'add // []' > /tmp/autofix/review-comments.json
              FIX_REVIEW=false
            fi
            echo "::endgroup::"

            echo "::group::Iteration $i — Claude"
            claude -p "You are the autofix step of a gitpm PR's CI.
          - /tmp/autofix/failing-checks.json lists failing CI checks (may be empty). For each, read the logs (gh run view / the check url) and fix the root cause. Never weaken or delete tests to make them pass.
          - If /tmp/autofix/review-comments.json exists, it holds inline comments from the automated /code-review on this commit. Fix the ones that are real bugs or AGENTS.md convention violations; ignore ones you judge wrong.
          - Follow AGENTS.md conventions. Verify with: bun run lint && bun run build && bun run test.
          - Do NOT commit, push, or comment on GitHub; the workflow commits your working-tree changes. If nothing should change, leave the tree clean." \
              --max-turns 30 --dangerously-skip-permissions \
              || echo "::warning::Claude exited non-zero"
            echo "::endgroup::"

            if [ -z "$(git status --porcelain --untracked-files=no)" ]; then
              summary "Stopped at iteration $i: no fix produced. Manual intervention required."
              exit 0
            fi

            # Tracked files only, so stray build output or secrets never get staged.
            git add -u
            git commit -m "fix: autofix failing checks (iteration $i)" \
              -m "Automated by claude-autofix[bot]: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            for attempt in 1 2 3 4 5; do
              git push origin "HEAD:${GITHUB_HEAD_REF}" && break
              [ "$attempt" -eq 5 ] && { echo "::error::push failed after 5 attempts"; exit 1; }
              sleep $((2 ** attempt))
            done
            sleep "$SLEEP_SEC"
          done

          summary "Reached max iterations ($MAX_ITERATIONS) without turning checks green. Manual intervention required."
