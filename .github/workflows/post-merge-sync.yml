name: Post-Merge Sync

# Final stage of the story lifecycle chain (see "Project management via .meta/"
# in AGENTS.md). Fires on any push to master that touches `.meta/**` — in
# particular when a release PR merges carrying the `chore(pm): mark shipped
# stories as done` commit written by `release-please.yml`. `gitpm push` then
# closes every GitHub issue whose story is now `status: done` (mapper at
# packages/sync-github/src/mapper.ts:232-235 maps done/cancelled → closed).
#
# Also exposes `workflow_dispatch` so a maintainer can run the sync manually
# from the Actions UI — useful when the workflow was disabled or a previous
# run failed and `.meta/` is out of sync with GitHub Issues.

on:
  push:
    branches: [master]
    paths:
      - '.meta/**'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  sync-to-github:
    name: Sync .meta/ to GitHub Issues
    runs-on: ubuntu-latest
    # workflow_dispatch lets the UI pick any branch, but the writeback step
    # below pushes to master — guard against a misclick that would overwrite
    # master with a feature branch's .meta/ state. Also skip the merge of our
    # own writeback PR (its squash commit keeps the PR title) so the sync
    # never loops on itself.
    if: >-
      github.ref == 'refs/heads/master' &&
      !startsWith(github.event.head_commit.message, 'chore(pm): persist GitHub sync metadata')
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Sync .meta/ to GitHub
        run: node packages/cli/dist/index.js push --token "$GITHUB_TOKEN" --yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Persist sync writebacks (github.issue_number on entities,
      # .meta/sync/github-state.json) through a PR. Master branch protection
      # blocks direct bot pushes (PR + signed commits required), so the bot
      # force-pushes a dedicated branch and opens, or refreshes, one PR from
      # it for a maintainer to squash-merge. PR validation
      # (`pr-validation.yml`) and the pre-push hook (`.githooks/pre-push`)
      # still block unsynced new entities from reaching master.
      #
      # Needs "Allow GitHub Actions to create and approve pull requests"
      # enabled in the repository's Actions settings. PRs opened with
      # GITHUB_TOKEN do not trigger other workflows, so required checks do
      # not run on the writeback PR.
      - name: Open PR with sync writebacks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: chore/sync-state-snapshot
          TITLE: 'chore(pm): persist GitHub sync metadata'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .meta/
          if git diff --cached --quiet; then
            echo "No sync writebacks to commit."
            exit 0
          fi
          git commit -m "$TITLE"
          git push -f origin "HEAD:$BRANCH"
          EXISTING=$(gh pr list --head "$BRANCH" --base master --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Refreshed existing writeback PR #$EXISTING."
            exit 0
          fi
          gh pr create --base master --head "$BRANCH" --title "$TITLE" \
            --body "Automated by post-merge-sync.yml after $GITHUB_SHA. Persists the github.* sync blocks and .meta/sync/github-state.json written by gitpm push. Merge it before the next .meta/ change lands so synced entities keep their issue numbers."
