version: 2
updates:
  # Minor/patch bumps are grouped so they land in one PR. Major bumps are
  # left out of the groups, so each arrives as its own PR and one breaking
  # upgrade (e.g. zod 4) can't block every safe update behind it.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
